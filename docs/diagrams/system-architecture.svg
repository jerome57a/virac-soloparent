<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1620 940" width="1620" height="940" font-family="Arial, Helvetica, sans-serif">
  <title>System architecture of e-SoloParentID</title>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs>
  <rect width="1620" height="940" fill="#ffffff"/>
  <rect x="360" y="24" width="200" height="70" fill="#fff" stroke="#000" stroke-width="2" />
  <text x="460" y="55" font-size="17" text-anchor="middle" font-weight="700">Applicant</text>
  <text x="460" y="76" font-size="12" text-anchor="middle" fill="#333">(Solo Parent)</text>
  <path d="M460,94 L460,142" fill="none" stroke="#000" stroke-width="1.7" marker-end="url(#a)"/>
  <rect x="680" y="24" width="200" height="70" fill="#fff" stroke="#000" stroke-width="2" />
  <text x="780" y="55" font-size="17" text-anchor="middle" font-weight="700">MSWD Staff</text>
  <text x="780" y="76" font-size="12" text-anchor="middle" fill="#333">(Social Worker)</text>
  <path d="M780,94 L780,142" fill="none" stroke="#000" stroke-width="1.7" marker-end="url(#a)"/>
  <rect x="1000" y="24" width="200" height="70" fill="#fff" stroke="#000" stroke-width="2" />
  <text x="1100" y="55" font-size="17" text-anchor="middle" font-weight="700">Administrator</text>
  <text x="1100" y="76" font-size="12" text-anchor="middle" fill="#333">(System Admin)</text>
  <path d="M1100,94 L1100,142" fill="none" stroke="#000" stroke-width="1.7" marker-end="url(#a)"/>
  <rect x="240" y="142" width="1080" height="64" fill="#fff" stroke="#000" stroke-width="2" />
  <text x="780" y="170" font-size="16" text-anchor="middle" font-weight="700">Web browser</text>
  <text x="780" y="192" font-size="12.5" text-anchor="middle">HTML, CSS and JavaScript (Bootstrap)  ·  English / Filipino  ·  light / dark theme  ·  works on phone and desktop</text>
  <path d="M780,206 L780,262" fill="none" stroke="#000" stroke-width="1.7" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="796" y="240" font-size="12.5" fill="#333">HTTP requests and pages</text>
  <rect x="40" y="262" width="1140" height="440" fill="#f2f5fa" stroke="#000" stroke-width="2.5" rx="10"/>
  <text x="60" y="290" font-size="16" font-weight="700">Web server: Apache + PHP 8 (XAMPP)</text>
  <rect x="70" y="330" width="230" height="112" fill="#fff" stroke="#000" stroke-width="2" />
  <text x="185" y="358" font-size="15" text-anchor="middle" font-weight="700">Entry pages</text>
  <text x="185" y="382" font-size="12.5" text-anchor="middle" >login, portal, apply, download</text>
  <text x="185" y="399" font-size="12.5" text-anchor="middle" >applicant/  staff/  admin/</text>
  <text x="185" y="416" font-size="12.5" text-anchor="middle" >one page per role and task</text>
  <rect x="345" y="330" width="230" height="112" fill="#fff" stroke="#000" stroke-width="2" />
  <text x="460" y="358" font-size="15" text-anchor="middle" font-weight="700">Controllers (12)</text>
  <text x="460" y="382" font-size="12.5" text-anchor="middle" >read the request,</text>
  <text x="460" y="399" font-size="12.5" text-anchor="middle" >check the user's role,</text>
  <text x="460" y="416" font-size="12.5" text-anchor="middle" >pick the page to show</text>
  <rect x="620" y="330" width="230" height="112" fill="#fff" stroke="#000" stroke-width="2" />
  <text x="735" y="358" font-size="15" text-anchor="middle" font-weight="700">Services (31)</text>
  <text x="735" y="382" font-size="12.5" text-anchor="middle" >the business rules:</text>
  <text x="735" y="399" font-size="12.5" text-anchor="middle" >applications, verification,</text>
  <text x="735" y="416" font-size="12.5" text-anchor="middle" >scheduling, SMS, accounts</text>
  <rect x="895" y="330" width="230" height="112" fill="#fff" stroke="#000" stroke-width="2" />
  <text x="1010" y="358" font-size="15" text-anchor="middle" font-weight="700">Models (20)</text>
  <text x="1010" y="382" font-size="12.5" text-anchor="middle" >read and write the</text>
  <text x="1010" y="399" font-size="12.5" text-anchor="middle" >database (PDO)</text>
  <path d="M300,386 L345,386" fill="none" stroke="#000" stroke-width="1.7" marker-end="url(#a)"/>
  <path d="M575,386 L620,386" fill="none" stroke="#000" stroke-width="1.7" marker-end="url(#a)"/>
  <path d="M850,386 L895,386" fill="none" stroke="#000" stroke-width="1.7" marker-end="url(#a)"/>
  <rect x="70" y="510" width="230" height="100" fill="#fff" stroke="#000" stroke-width="2" />
  <text x="185" y="538" font-size="15" text-anchor="middle" font-weight="700">Config and helpers</text>
  <text x="185" y="562" font-size="12.5" text-anchor="middle" >login and sessions, CSRF,</text>
  <text x="185" y="579" font-size="12.5" text-anchor="middle" >roles and permissions,</text>
  <text x="185" y="596" font-size="12.5" text-anchor="middle" >settings, audit log (all layers)</text>
  <rect x="345" y="510" width="230" height="100" fill="#fff" stroke="#000" stroke-width="2" />
  <text x="460" y="538" font-size="15" text-anchor="middle" font-weight="700">Views (77 templates)</text>
  <text x="460" y="562" font-size="12.5" text-anchor="middle" >the HTML each role sees,</text>
  <text x="460" y="579" font-size="12.5" text-anchor="middle" >with the same layout</text>
  <path d="M460,442 L460,510" fill="none" stroke="#000" stroke-width="1.7" marker-end="url(#a)"/>
  <rect x="895" y="770" width="230" height="96" fill="#fff" stroke="#000" stroke-width="2" />
  <text x="1010" y="798" font-size="15" text-anchor="middle" font-weight="700">MariaDB database</text>
  <text x="1010" y="820" font-size="12" text-anchor="middle" >37 tables: accounts, applications,</text>
  <text x="1010" y="836" font-size="12" text-anchor="middle" >documents, schedules, SMS log,</text>
  <text x="1010" y="852" font-size="12" text-anchor="middle" >audit log, settings</text>
  <path d="M1010,442 L1010,770" fill="none" stroke="#000" stroke-width="1.7" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="1026" y="640" font-size="12.5" fill="#333">SQL</text>
  <rect x="345" y="770" width="260" height="96" fill="#fff" stroke="#000" stroke-width="2" />
  <text x="475" y="798" font-size="15" text-anchor="middle" font-weight="700">File storage</text>
  <text x="475" y="820" font-size="12" text-anchor="middle" >uploaded documents and photos,</text>
  <text x="475" y="836" font-size="12" text-anchor="middle" >sessions, logs (not reachable</text>
  <text x="475" y="852" font-size="12" text-anchor="middle" >from the web; served by download.php)</text>
  <path d="M680,442 L680,730 L475,730 L475,770" fill="none" stroke="#000" stroke-width="1.7" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="560" y="722" font-size="12.5" fill="#333">documents</text>
  <rect x="640" y="770" width="220" height="96" fill="#eef1f5" stroke="#000" stroke-width="2" />
  <text x="750" y="798" font-size="14" text-anchor="middle" font-weight="700">Windows Task Scheduler</text>
  <text x="750" y="820" font-size="12" text-anchor="middle" >runs cron/renewal-reminders.php</text>
  <text x="750" y="836" font-size="12" text-anchor="middle" >every day at 8:00 AM</text>
  <text x="750" y="852" font-size="12" text-anchor="middle" >(ID expiry reminders)</text>
  <path d="M780,770 L780,442" fill="none" stroke="#000" stroke-width="1.7" marker-end="url(#a)"/>
  <rect x="1260" y="240" width="320" height="130" fill="#eef1f5" stroke="#000" stroke-width="2" />
  <text x="1420" y="270" font-size="15" text-anchor="middle" font-weight="700">IPROG SMS gateway</text>
  <text x="1420" y="294" font-size="12.5" text-anchor="middle" >sends the text messages</text>
  <text x="1420" y="310" font-size="12.5" text-anchor="middle" >(schedules, corrections, ID expiry</text>
  <text x="1420" y="326" font-size="12.5" text-anchor="middle" >reminders) through an HTTPS API call</text>
  <text x="1420" y="342" font-size="12.5" text-anchor="middle" >with the API token</text>
  <path d="M700,330 L700,300 L1260,300" fill="none" stroke="#000" stroke-width="1.7" marker-end="url(#a)"/>
  <rect x="1260" y="420" width="320" height="110" fill="#eef1f5" stroke="#000" stroke-width="2" />
  <text x="1420" y="450" font-size="15" text-anchor="middle" font-weight="700">Tesseract OCR</text>
  <text x="1420" y="474" font-size="12.5" text-anchor="middle" >reads the text on each uploaded</text>
  <text x="1420" y="490" font-size="12.5" text-anchor="middle" >document for the name check</text>
  <text x="1420" y="506" font-size="12.5" text-anchor="middle" >(a local program run by PHP)</text>
  <path d="M850,330 L850,316 L1230,316 L1230,470 L1260,470" fill="none" stroke="#000" stroke-width="1.7" marker-end="url(#a)"/>
</svg>
